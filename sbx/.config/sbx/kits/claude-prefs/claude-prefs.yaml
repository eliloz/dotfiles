# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Claude preferences
description: Personal Claude Code settings and notification preferences for every sandbox
requires: ["claude"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Managed settings sit above every other settings file and leave the
        # sandbox-owned ~/.claude/settings.json alone. Add settings here.
        - command: |
            set -eu
            mkdir -p /etc/claude-code
            cat > /etc/claude-code/managed-settings.json <<'JSON'
            {
              "disableClaudeAiConnectors": true,
              "disableWorkflows": true,
              "disableBundledSkills": true,
              "disableArtifact": true,
              "statusLine": {
                "type": "command",
                "command": "/etc/claude-code/statusline.sh"
              }
            }
            JSON
            # Status line: context tokens in bold yellow, then (percent used) in
            # grey, e.g. "45.2k(23%)". Claude pipes session JSON to stdin. jq only:
            # no Node or network, so the sandbox firewall never matters.
            cat > /etc/claude-code/statusline.sh <<'SH'
            #!/bin/sh
            jq -r '
              (.context_window // {}) as $c
              | ($c.current_usage // {}) as $u
              | (($u.input_tokens // 0) + ($u.cache_creation_input_tokens // 0)
                 + ($u.cache_read_input_tokens // 0)) as $tok
              | ($c.used_percentage // 0 | floor) as $pct
              | (if $tok >= 1000 then (($tok / 100 | floor) / 10 | tostring) + "k"
                 else ($tok | tostring) end) as $len
              | "\u001b[1;33m\($len)\u001b[0m\u001b[90m(\($pct)%)\u001b[0m"
            '
            SH
            chmod 755 /etc/claude-code/statusline.sh
          user: root
          description: Install personal Claude Code settings and status line as managed settings
      startup:
        # Claude can't detect the host terminal from inside the sandbox, so it
        # sends no notifications by default. A terminal bell passes through
        # tmux, which marks the window. Claude rings once idle for
        # messageIdleNotifThresholdMs (default 60s).
        - command: |
            set -eu
            f="$HOME/.claude.json"
            [ -s "$f" ] || echo '{}' > "$f"
            jq '.preferredNotifChannel = "terminal_bell"
              | .messageIdleNotifThresholdMs = 5000
              | .taskCompleteNotifEnabled = true
              | .inputNeededNotifEnabled = true' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          user: agent
          description: Ring the terminal bell when Claude finishes or needs input
